name: CI & Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Use GitHub Container Registry (GHCR)
  REGISTRY: ghcr.io
  # Image names (lowercase of your repo)
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Frontend dependencies
        run: npm ci --prefix frontend

      - name: Run Frontend lint
        run: npm run lint --prefix frontend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Cache pip dependencies

      - name: Install Backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Backend linter (Placeholder)
        run: |
          # Add a linter like flake8 or black
          # pip install flake8
          # flake8 backend
          echo "Add backend linting here"

      - name: Run Tests (Placeholder)
        run: |
          # Add your test runner, e.g., pytest
          # pip install pytest
          # pytest
          echo "Add tests here"

  build-backend:
    name: Build Backend Docker
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Only run if backend files or this workflow file changed
    paths:
      - 'backend/**'
      - '.github/workflows/ci-pipeline.yml'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/autoinspect-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Docker
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Only run if frontend files or this workflow file changed
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-pipeline.yml'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/autoinspect-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max